name: Compilar XITO Key Admin IPA (iOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Descargar código del proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar App iOS (Sin firma)
        run: |
          set -o pipefail
          xcodebuild -project XitoKeyAdmin.xcodeproj \
            -scheme XitoKeyAdmin \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_COMPILATION_MODE=singlefile \
            build 2>&1 | tee xcodebuild.log || (echo "=== ERRORES DE COMPILACION ===" && grep -i "error:" xcodebuild.log | head -n 30 && exit 1)

      - name: Empaquetar archivo .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/XitoKeyAdmin.app Payload/
          zip -r XitoKeyAdmin.ipa Payload

      - name: Subir IPA compilado
        uses: actions/upload-artifact@v4
        with:
          name: XitoKeyAdmin-IPA
          path: XitoKeyAdmin.ipa
