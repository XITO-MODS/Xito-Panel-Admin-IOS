name: XitoKeyAdmin
options:
  bundleIdPrefix: com.xito
  deploymentTarget:
    iOS: "15.0"
targets:
  XitoKeyAdmin:
    type: application
    platform: iOS
    sources:
      - path: XitoKeyAdmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xito.keyadmin
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: XitoKeyAdmin/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
